<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول العملاء</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif; min-height: 100vh; display: grid; place-items: center;
            background: linear-gradient(135deg, #4f46e5, #10b981); color: #111827;
        }
        .card {
            width: min(90vw, 420px); background: rgba(255,255,255,0.96); border-radius: 18px; padding: 28px 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }
        h1 { margin: 0 0 20px; text-align: center; }
        .field { margin-bottom: 16px; }
        label { display:block; margin-bottom:8px; font-weight:600; }
        input {
            width:100%; padding:12px 14px; border-radius:10px; border:1px solid #d1d5db; font-size:16px;
        }
        button {
            width:100%; padding:12px; border:none; border-radius:10px; background: linear-gradient(135deg, #059669, #10b981); color:white; font-weight:700; cursor:pointer;
        }
        .back { display:inline-block; margin-top:14px; color:#111827; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>دخول العملاء</h1>
        <div class="field">
            <label>اسم العميل</label>
            <input type="text" placeholder="أدخل اسم العميل" />
        </div>
        <div class="field">
            <label>كلمة المرور</label>
            <input type="password" placeholder="أدخل كلمة المرور" />
        </div>
        <button>تسجيل الدخول</button>
        <div style="text-align:center; margin-top:14px;">
            <a class="back" href="index.html">العودة للصفحة الرئيسية</a>
        </div>
    </div>
</body>
</html>
