<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>طلب شراء جديد | أورجا فارما</title><link rel="stylesheet" href="customer.css"><style>.order-main{max-width:1280px;margin:auto;padding:46px 22px}.order-topbar{justify-content:space-between}.catalog-tools{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin-bottom:18px}.search-box{height:44px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--muted)}.search-box input{border:0;outline:0;width:100%;background:transparent;font-size:12px}.catalog-tools select{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);padding:0 12px;font-size:12px}.catalog-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;display:flex;flex-direction:column;min-height:210px}.product-card.out{opacity:.62}.product-card h3{font-size:13px;margin:12px 0 3px}.product-code,.product-company{font-size:10px;color:var(--muted)}.product-company{margin-top:5px}.product-price{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:12px}.product-price strong{color:var(--brand);font-size:16px}.product-price span{color:var(--accent);font-size:10px}.product-card button{margin-top:11px;border:0;background:var(--brand);color:#fff;border-radius:8px;padding:9px;font-size:11px;cursor:pointer}.product-card.out button{background:#9aa1af;cursor:not-allowed}.cart-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;height:max-content;position:sticky;top:92px}.cart-heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}.cart-heading h2{font-size:16px;margin:0}.cart-heading button{border:0;background:none;color:var(--muted);font-size:22px}.empty-cart{text-align:center;color:var(--muted);font-size:11px;padding:30px 0}.cart-line{display:grid;grid-template-columns:1fr auto;gap:5px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-line b,.cart-line small{display:block;font-size:11px}.cart-line small{color:var(--muted)}.cart-line button{border:0;background:none;color:#d85862}.cart-total{display:flex;justify-content:space-between;padding:17px 0;font-size:12px}.cart-total strong{color:var(--brand)}.full{width:100%}@media(max-width:900px){.catalog-layout{grid-template-columns:1fr}.cart-panel{position:fixed;inset:74px 0 0 auto;width:min(360px,100%);z-index:20;transform:translateX(100%);transition:.25s;overflow:auto}.cart-panel.open{transform:translateX(0)}.products-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.catalog-tools{grid-template-columns:1fr}.products-grid{grid-template-columns:1fr}.order-main{padding:30px 14px}}
</style></head>
<body><header class="customer-topbar order-topbar"><a class="back-link" href="customer-dashboard.html">→ لوحة العميل</a><div class="customer-brand"><span>+</span><strong>طلب شراء جديد</strong></div><button class="cart-button" id="cartButton">🛒 السلة <b id="cartCount">0</b></button></header><main class="order-main"><section class="order-heading"><div><span class="eyebrow">كتالوج التوزيع</span><h1>اختر المنتجات المطلوبة</h1><p>ابحث في المنتجات وحدد الكمية ثم أرسل طلبك للمراجعة.</p></div></section><section class="catalog-tools"><label class="search-box">⌕<input id="productSearch" type="search" placeholder="ابحث عن صنف أو كود..."></label><select id="companyFilter"><option value="">كل الشركات</option><option>فارما كير</option><option>النيل</option><option>تاج</option></select><select id="categoryFilter"><option value="">كل التصنيفات</option><option>أدوية</option><option>مكملات</option><option>عناية</option></select></section><div class="catalog-layout"><section class="products-grid" id="productsGrid"></section><aside class="cart-panel" id="cartPanel"><div class="cart-heading"><h2>سلة الطلب</h2><button id="closeCart">×</button></div><div id="cartItems"></div><div class="cart-total"><span>الإجمالي</span><strong id="cartTotal">0.00 ج.م</strong></div><button class="customer-primary full" id="submitOrder">إرسال الطلب</button></aside></div></main><div class="toast" id="customerToast"></div><script src="customer.js"></script></body></html>
