<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمل فاتورتك بنفسك</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin:0; font-family: Arial, sans-serif; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #1d4ed8, #0ea5e9); color:#0f172a;
        }
        .card {
            width:min(90vw,560px); background: rgba(255,255,255,0.96); border-radius:18px; padding:32px 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); text-align:center;
        }
        h1 { margin:0 0 12px; }
        p { margin:0 0 24px; line-height:1.7; }
        button { padding:12px 18px; border:none; border-radius:10px; background: linear-gradient(135deg, #0ea5e9, #2563eb); color:white; font-weight:700; cursor:pointer; }
        .back { display:inline-block; margin-top:20px; color:#0f172a; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>اعمل فاتورتك بنفسك</h1>
        <p>هذه صفحة نموذجية للواجهة الخاصة بإنشاء الفاتورة بنفس المستخدم، ويمكن تطويرها لاحقًا لواجهة العميل الفعلية.</p>
        <button>ابدأ الفاتورة</button>
        <div>
            <a class="back" href="index.html">العودة للصفحة الرئيسية</a>
        </div>
    </div>
</body>
</html>
